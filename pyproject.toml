[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ryanggz-variance"
version = "0.1.0"
description = "从样本里推断评测方差的报告方式应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ryanggz" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ryanggz.github.io"
Repository = "https://github.com/ryanggz/variance"
Issues = "https://github.com/ryanggz/variance/issues"

[project.scripts]
variance = "variance:main"

[tool.setuptools]
py-modules = ["variance"]
